<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Developer workspace</title>
  <desc id="d">Three monitors showing Java code, a system design diagram and a monitoring dashboard</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#16233f"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111c33"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity=".35"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity=".14"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" opacity=".12"/>
    </pattern>
  </defs>

  <style>
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .flow  { stroke-dasharray: 4 4; animation: dash 1.2s linear infinite; }
    .draw  { stroke-dasharray: 260; animation: draw 5s ease-in-out infinite; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    .steam { animation: steam 2.6s ease-in-out infinite; }
    .steam.b { animation-delay: 1.2s; }
    @keyframes dash  { to { stroke-dashoffset: -16; } }
    @keyframes draw  { 0% { stroke-dashoffset: 260; } 55%, 100% { stroke-dashoffset: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes steam { 0% { opacity: 0; transform: translateY(5px); } 50% { opacity: .75; } 100% { opacity: 0; transform: translateY(-7px); } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .draw, .blink, .steam { animation: none; }
    }
  </style>

  <!-- Background -->
  <rect width="900" height="420" rx="20" fill="url(#bg)"/>
  <rect width="900" height="420" rx="20" fill="url(#dots)"/>
  <ellipse cx="450" cy="140" rx="300" ry="170" fill="url(#glow)"/>
  <ellipse cx="450" cy="330" rx="260" ry="90" fill="url(#glow2)"/>
  <rect x=".5" y=".5" width="899" height="419" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- Decorative code in corners -->
  <g class="m" font-size="12" opacity=".55">
    <text x="40" y="36" fill="#61afef">public class Developer {</text>
    <text x="58" y="54" fill="#98c379">buildScalableSystems();</text>
    <text x="40" y="72" fill="#61afef">}</text>
    <text x="860" y="36" text-anchor="end" fill="#c678dd">while (true) {</text>
    <text x="860" y="54" text-anchor="end" fill="#98c379">keepCoding();  </text>
    <text x="860" y="72" text-anchor="end" fill="#c678dd">}</text>
  </g>

  <!-- ============ LEFT MONITOR: code ============ -->
  <rect x="150" y="235" width="10" height="20" fill="#273449"/>
  <rect x="128" y="253" width="54" height="8" rx="4" fill="#273449"/>

  <rect x="40" y="85" width="230" height="150" rx="12" fill="url(#screen)" stroke="#2b3b57" stroke-width="1.5"/>
  <path d="M40 97 a12 12 0 0 1 12 -12 h206 a12 12 0 0 1 12 12 v14 h-230 z" fill="#ffffff" fill-opacity=".04"/>
  <circle cx="56" cy="98" r="4" fill="#ff5f56"/>
  <circle cx="70" cy="98" r="4" fill="#ffbd2e"/>
  <circle cx="84" cy="98" r="4" fill="#27c93f"/>
  <text class="m" x="255" y="102" text-anchor="end" font-size="10" fill="#64748b">SubscriptionApi.java</text>

  <g class="m" font-size="11">
    <text x="56" y="132"><tspan fill="#e5c07b">@RestController</tspan></text>
    <text x="56" y="150"><tspan fill="#c678dd">class </tspan><tspan fill="#61afef">SubscriptionApi</tspan><tspan fill="#abb2bf"> {</tspan></text>
    <text x="70" y="168"><tspan fill="#e5c07b">@GetMapping</tspan><tspan fill="#abb2bf">(</tspan><tspan fill="#98c379">"/{id}"</tspan><tspan fill="#abb2bf">)</tspan></text>
    <text x="70" y="186"><tspan fill="#c678dd">public </tspan><tspan fill="#61afef">Response </tspan><tspan fill="#abb2bf">get(id) {</tspan></text>
    <text x="84" y="204"><tspan fill="#c678dd">return </tspan><tspan fill="#abb2bf">service.find(id);</tspan></text>
    <text x="70" y="222" fill="#abb2bf">}</text>
  </g>
  <rect class="blink" x="80" y="212" width="6" height="12" fill="#61afef"/>

  <!-- ============ CENTER MONITOR: system design ============ -->
  <rect x="444" y="235" width="12" height="20" fill="#273449"/>
  <rect x="418" y="253" width="64" height="8" rx="4" fill="#273449"/>

  <rect x="300" y="45" width="300" height="190" rx="14" fill="url(#screen)" stroke="#fbbf24" stroke-opacity=".75" stroke-width="1.8"/>
  <path d="M300 59 a14 14 0 0 1 14 -14 h272 a14 14 0 0 1 14 14 v12 h-300 z" fill="#ffffff" fill-opacity=".04"/>
  <circle cx="318" cy="58" r="4" fill="#ff5f56"/>
  <circle cx="332" cy="58" r="4" fill="#ffbd2e"/>
  <circle cx="346" cy="58" r="4" fill="#27c93f"/>
  <text class="m" x="450" y="62" text-anchor="middle" font-size="10" fill="#fbbf24">// System Design</text>

  <!-- connectors -->
  <g fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="flow">
    <path d="M450 110 V126"/>
    <path d="M450 152 V164"/>
    <path d="M358 164 H542"/>
    <path d="M358 164 V172"/>
    <path d="M450 164 V172"/>
    <path d="M542 164 V172"/>
  </g>

  <!-- nodes -->
  <g class="m" font-size="10" text-anchor="middle">
    <rect x="390" y="84" width="120" height="26" rx="8" fill="#38bdf8" fill-opacity=".14" stroke="#38bdf8"/>
    <text x="450" y="101" fill="#7dd3fc">API Gateway</text>

    <rect x="405" y="126" width="90" height="26" rx="8" fill="#fbbf24" fill-opacity=".14" stroke="#fbbf24"/>
    <text x="450" y="143" fill="#fcd34d">Kafka</text>

    <rect x="318" y="172" width="80" height="26" rx="8" fill="#f87171" fill-opacity=".14" stroke="#f87171"/>
    <text x="358" y="189" fill="#fca5a5">Redis</text>

    <rect x="410" y="172" width="80" height="26" rx="8" fill="#34d399" fill-opacity=".14" stroke="#34d399"/>
    <text x="450" y="189" fill="#6ee7b7">Service</text>

    <rect x="502" y="172" width="80" height="26" rx="8" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa"/>
    <text x="542" y="189" fill="#c4b5fd">MySQL</text>

    <text x="450" y="221" fill="#94a3b8">Spring Boot  |  Java</text>
  </g>

  <!-- ============ RIGHT MONITOR: monitoring ============ -->
  <rect x="740" y="235" width="10" height="20" fill="#273449"/>
  <rect x="718" y="253" width="54" height="8" rx="4" fill="#273449"/>

  <rect x="630" y="85" width="230" height="150" rx="12" fill="url(#screen)" stroke="#2b3b57" stroke-width="1.5"/>
  <path d="M630 97 a12 12 0 0 1 12 -12 h206 a12 12 0 0 1 12 12 v14 h-230 z" fill="#ffffff" fill-opacity=".04"/>
  <circle cx="646" cy="98" r="4" fill="#ff5f56"/>
  <circle cx="660" cy="98" r="4" fill="#ffbd2e"/>
  <circle cx="674" cy="98" r="4" fill="#27c93f"/>
  <text class="m" x="845" y="102" text-anchor="end" font-size="10" fill="#64748b">Monitoring</text>

  <!-- chart -->
  <g stroke="#ffffff" stroke-opacity=".07">
    <path d="M650 130 H840"/>
    <path d="M650 160 H840"/>
    <path d="M650 190 H840"/>
    <path d="M650 205 H840" stroke-opacity=".18"/>
  </g>
  <path d="M650 190 L677 175 L704 182 L731 150 L758 165 L785 138 L812 152 L840 128 L840 205 L650 205 Z" fill="url(#area)"/>
  <path class="draw" d="M650 190 L677 175 L704 182 L731 150 L758 165 L785 138 L812 152 L840 128" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="840" cy="128" r="3.5" fill="#34d399"/>
  <circle cx="840" cy="128" r="3.5" fill="none" stroke="#34d399">
    <animate attributeName="r" values="3.5;9;3.5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".8;0;.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text class="m" x="650" y="124" font-size="9" fill="#64748b">p99 latency</text>
  <text class="m" x="650" y="224" font-size="10" fill="#61afef">Grafana / Prometheus</text>

  <!-- ============ DESK ============ -->
  <rect x="24" y="261" width="852" height="9" rx="4.5" fill="#1e293b"/>
  <rect x="24" y="261" width="852" height="2" rx="1" fill="#475569" fill-opacity=".7"/>

  <!-- keyboard + mouse -->
  <rect x="390" y="250" width="120" height="11" rx="4" fill="#1e293b" stroke="#475569"/>
  <path d="M398 255.5 H502" stroke="#475569" stroke-width="3" stroke-dasharray="7 3" stroke-linecap="round"/>
  <rect x="528" y="252" width="14" height="9" rx="4.5" fill="#1e293b" stroke="#475569"/>

  <!-- plant (between left and center monitors) -->
  <g>
    <path d="M285 248 C279 240 278 232 281 227 C286 232 288 240 285 248Z" fill="#34d399" fill-opacity=".9"/>
    <path d="M285 248 C291 241 293 234 291 229 C286 233 284 241 285 248Z" fill="#10b981"/>
    <path d="M277 248 h16 l-2 13 h-12 z" fill="#c2410c"/>
  </g>

  <!-- coffee (between center and right monitors) -->
  <g>
    <path class="steam" d="M609 244 q-3 -5 0 -9 q3 -4 0 -8" fill="none" stroke="#e2e8f0" stroke-width="1.6" stroke-linecap="round"/>
    <path class="steam b" d="M616 244 q-3 -5 0 -9 q3 -4 0 -8" fill="none" stroke="#e2e8f0" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="604" y="246" width="16" height="15" rx="3" fill="#e2e8f0"/>
    <path d="M620 249 q7 0 5 6 q-1 3 -5 3" fill="none" stroke="#e2e8f0" stroke-width="2.4"/>
  </g>

  <!-- ============ FOOTER ============ -->
  <text class="m" x="450" y="312" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="3" fill="#fbbf24">EAT • SLEEP • CODE • REPEAT</text>
  <text class="m" x="450" y="336" text-anchor="middle" font-size="12" fill="#94a3b8">Building scalable systems, one line at a time</text>

  <!-- tech chips -->
  <g class="m" font-size="11" text-anchor="middle" fill="#cbd5e1">
    <rect x="213" y="354" width="49"  height="22" rx="11" fill="#1e293b" stroke="#334155"/><text x="237.5" y="369">Java</text>
    <rect x="272" y="354" width="97"  height="22" rx="11" fill="#1e293b" stroke="#334155"/><text x="320.5" y="369">Spring Boot</text>
    <rect x="379" y="354" width="56"  height="22" rx="11" fill="#1e293b" stroke="#334155"/><text x="407"   y="369">Kafka</text>
    <rect x="445" y="354" width="56"  height="22" rx="11" fill="#1e293b" stroke="#334155"/><text x="473"   y="369">Redis</text>
    <rect x="511" y="354" width="56"  height="22" rx="11" fill="#1e293b" stroke="#334155"/><text x="539"   y="369">MySQL</text>
    <rect x="577" y="354" width="110" height="22" rx="11" fill="#1e293b" stroke="#334155"/><text x="632"   y="369">Microservices</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
