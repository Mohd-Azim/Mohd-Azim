
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#101827"/>
      <stop offset="1" stop-color="#243B55"/>
    </linearGradient>
    <linearGradient id="screen" x2="0" y2="1">
      <stop stop-color="#172D46"/>
      <stop offset="1" stop-color="#080D17"/>
    </linearGradient>
  </defs>

  <rect width="900" height="430" rx="22" fill="url(#bg)"/>

  <circle cx="150" cy="100" r="100" fill="#F7A41D" opacity=".06"/>
  <circle cx="750" cy="100" r="110" fill="#00B8D9" opacity=".07"/>

  <g font-family="monospace" font-size="12" fill="#61AFEF" opacity=".6">
    <text x="35" y="55">public class Developer {</text>
    <text x="55" y="75" fill="#98C379">buildScalableSystems();</text>
    <text x="35" y="95">}</text>
    <text x="720" y="65" fill="#C678DD">while (true) {</text>
    <text x="740" y="85" fill="#98C379">keepCoding();</text>
    <text x="720" y="105">}</text>
  </g>

  <!-- Left monitor -->
  <rect x="80" y="110" width="210" height="150" rx="9" fill="#080D17" stroke="#60758C" stroke-width="4"/>
  <rect x="90" y="120" width="190" height="130" rx="3" fill="url(#screen)"/>

  <g font-family="monospace" font-size="11">
    <text x="105" y="145" fill="#E06C75">import</text>
    <text x="148" y="145" fill="#61AFEF">java.util.*;</text>
    <text x="105" y="165" fill="#C678DD">public class</text>
    <text x="185" y="165" fill="#E5C07B">Service</text>
    <text x="105" y="185" fill="#ABB2BF">{</text>
    <text x="115" y="205" fill="#98C379">processRequest();</text>
    <text x="115" y="225" fill="#61AFEF">return response;</text>
    <text x="105" y="240" fill="#ABB2BF">}</text>
  </g>

  <path d="M175 260 V280 H210 V285 H175 Z" fill="#697D91"/>

  <!-- Center monitor -->
  <rect x="325" y="65" width="250" height="195" rx="10" fill="#080D17" stroke="#F7A41D" stroke-width="3"/>
  <rect x="335" y="75" width="230" height="175" rx="4" fill="url(#screen)"/>

  <g font-family="monospace" font-size="12">
    <text x="350" y="100" fill="#F7A41D">// System Design</text>
    <rect x="385" y="115" width="130" height="25" rx="5" fill="#1E4961" stroke="#61AFEF"/>
    <text x="450" y="132" fill="#DCEAF5" text-anchor="middle">API Gateway</text>
    <path d="M450 140 V155" stroke="#98C379" stroke-width="2"/>
    <rect x="405" y="155" width="90" height="25" rx="5" fill="#293D53" stroke="#98C379"/>
    <text x="450" y="172" fill="#98C379" text-anchor="middle">Kafka</text>
    <path d="M450 180 V192 H390 V202 M450 192 H510 V202" stroke="#98C379" fill="none" stroke-width="2"/>
    <rect x="355" y="202" width="75" height="25" rx="4" fill="#293D53" stroke="#61AFEF"/>
    <rect x="470" y="202" width="75" height="25" rx="4" fill="#293D53" stroke="#61AFEF"/>
    <text x="392" y="219" fill="#61AFEF" text-anchor="middle">Redis</text>
    <text x="507" y="219" fill="#61AFEF" text-anchor="middle">Service</text>
    <text x="450" y="243" fill="#C678DD" text-anchor="middle">Spring Boot | Java</text>
  </g>

  <path d="M450 260 V280 H485 V285 H450 Z" fill="#697D91"/>

  <!-- Right monitor -->
  <rect x="620" y="110" width="190" height="150" rx="9" fill="#080D17" stroke="#60758C" stroke-width="4"/>
  <rect x="630" y="120" width="170" height="130" rx="3" fill="url(#screen)"/>

  <g font-family="monospace" font-size="11">
    <text x="645" y="143" fill="#F7A41D">Monitoring</text>
    <path d="M650 225 V165 H785" stroke="#60758C" fill="none"/>
    <path d="M650 215 L670 205 L690 210 L710 180 L730 195 L750 170 L770 185 L790 160" stroke="#98C379" stroke-width="2.5" fill="none"/>
    <text x="645" y="242" fill="#61AFEF">Grafana / Prometheus</text>
  </g>

  <path d="M700 260 V280 H735 V285 H700 Z" fill="#697D91"/>

  <!-- Desk -->
  <rect x="45" y="285" width="810" height="16" rx="5" fill="#A66B36"/>
  <path d="M85 301 L75 390 M815 301 L825 390" stroke="#70411F" stroke-width="12" stroke-linecap="round"/>

  <!-- Chair -->
  <rect x="345" y="285" width="210" height="105" rx="28" fill="#273A52" stroke="#536B84" stroke-width="3"/>
  <path d="M450 390 V410 M420 410 H480" stroke="#657C94" stroke-width="6" stroke-linecap="round"/>

  <!-- Developer -->
  <circle cx="450" cy="173" r="36" fill="#D99A72"/>
  <path d="M414 170 Q410 130 450 130 Q490 132 486 170 L476 153 Q450 166 420 151 Z" fill="#24202A"/>
  <circle cx="438" cy="175" r="3" fill="#29212A"/>
  <circle cx="463" cy="175" r="3" fill="#29212A"/>
  <path d="M442 192 Q450 198 459 192" fill="none" stroke="#864C42" stroke-width="2"/>

  <!-- Body -->
  <path d="M410 220 Q450 195 490 220 L520 285 H380 Z" fill="#F7A41D"/>
  <path d="M425 220 L450 253 L475 220" fill="#E8EDF5"/>
  <path d="M450 253 L443 285 H460 Z" fill="#34495E"/>

  <!-- Arms -->
  <path d="M405 230 Q380 250 350 270 L365 282 Q405 270 425 250" fill="#D99A72"/>
  <path d="M495 230 Q520 250 550 270 L535 282 Q500 270 480 250" fill="#D99A72"/>

  <!-- Keyboard -->
  <rect x="355" y="276" width="190" height="9" rx="4" fill="#26374B"/>
  <path d="M370 280 H530 M385 276 V284 M405 276 V284 M425 276 V284 M445 276 V284 M465 276 V284 M485 276 V284 M505 276 V284 M525 276 V284" stroke="#60758C"/>

  <!-- Coffee -->
  <rect x="760" y="263" width="35" height="22" rx="5" fill="#D9DDE5"/>
  <path d="M795 269 Q815 267 805 281 H795" fill="none" stroke="#D9DDE5" stroke-width="4"/>
  <path d="M768 260 Q763 250 771 246 M782 260 Q777 250 785 246" stroke="#E6E6E6" stroke-width="2" fill="none"/>

  <text x="450" y="350" font-family="monospace" font-size="16" text-anchor="middle" fill="#F7A41D">EAT • SLEEP • CODE • REPEAT</text>
  <text x="450" y="425" font-family="monospace" font-size="12" text-anchor="middle" fill="#9AADC2">Building scalable systems, one line at a time 🚀</text>
</svg>
